<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <link rel="stylesheet" href="login.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <img src="assets/Group 35.png" alt="">
    </header>

    <main>

        <form action = "" id = "login">
            <h2>Conectar no QuiStock</h2>
        
            <div id = "email_senha">
                <h4>Email</h4>
                <input  id = "email" type="email" placeholder="email" autocomplete="given-name">
                <h4>Senha</h4>
                <input id = "password" type="password" placeholder="senha" autocomplete="current-password">
            </div>
            <a href="#">Esqueceu a senha?</a>

            <button id = "button" type="submit">Continuar</button>
            <script src="login.js"></script>
        </form>

        <img src="assets/Rectangle 46.png" alt="fundo" id = "fundo_login">

    </main>
</body>
</html>
